<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="calculator.css">
    <script src="calculator.js" defer></script>
  </head>
  <body>

    <div class="container">
      <div class="screen-container">
        Open console for calculation results
      </div>
      <div class="num-container">
        <div class="Row">
          <button onclick="calculation('1');" class="Number">1</button>
          <button onclick="calculation('2');" class="Number">2</button>
          <button onclick="calculation('3');" class="Number">3</button>
          <button onclick="calculation('+');" class="Number">+</button>
        </div>

        <div class="Row">
          <button onclick="calculation('4');" class="Number">4</button>
          <button onclick="calculation('5');" class="Number">5</button>
          <button onclick="calculation('6');" class="Number">6</button>
          <button onclick="calculation('-');" class="Operation">-</button>
        </div>

        <div class="Row">
          <button onclick="calculation('7');" class="Number">7</button>
          <button onclick="calculation('8');" class="Number">8</button>
          <button onclick="calculation('9');" class="Number">9</button>
          <button onclick="calculation('*');" class="Operation">*</button>
        </div>

        <div class="Row">
          <button onclick="calculation('0');" class="Number">0</button>
          <button onclick="calculation('.');" class="Special">.</button>
          <button onclick="calc = eval(calc); console.log(calc);" class="Special">=</button>
          <button onclick="calculation('/');" class="Operation">/</button>
        </div>

        <div class="Row">
          <button onclick="calculation('');" class="Special">Clear</button>
        </div>
      </div>
    </div>
  </body>
</html>
